# VPS reverse proxy for the SplitLLM V2 API.
#
# Path: laptop -> VPS:443 -> WireGuard/private LAN -> backend host :8080
#
# NO basic auth here, deliberately. The application already authenticates every
# request with a bearer token, and stacking basic auth on top would break
# exactly the clients this exists for: `Authorization` can carry one scheme, so
# a proxy-level Basic challenge and an app-level Bearer token cannot both be
# sent. The previous Pterodactyl notes in this directory hit the same wall from
# the other direction.
#
# Install as /etc/nginx/sites-available/splitllm-api.conf, symlink into
# sites-enabled, `nginx -t`, then reload. Get a cert first:
#   sudo certbot certonly --nginx -d api.splitllm.example
# Until a hostname exists, do not enable this file — use the SSH tunnel instead
# (see README).

upstream splitllm_v2 {
    # The backend's private/WireGuard IP — edit to yours.
    server 10.0.0.2:8080;
    keepalive 8;
}

server {
    listen 80;
    server_name REPLACE_WITH_HOSTNAME;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name REPLACE_WITH_HOSTNAME;

    ssl_certificate     /etc/letsencrypt/live/REPLACE_WITH_HOSTNAME/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/REPLACE_WITH_HOSTNAME/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 2m;

    location / {
        proxy_pass http://splitllm_v2;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The three lines that make streaming actually stream. Without them
        # nginx buffers the whole NDJSON response and releases it at the end,
        # so the client sees nothing for minutes and then everything at once.
        proxy_buffering off;
        proxy_request_buffering off;
        gzip off;

        # A CPU generation legitimately runs for minutes. The default 60s
        # read timeout would cut long answers off mid-sentence.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # Liveness for uptime monitoring: no token, no body, nothing revealed.
    location = /ping {
        proxy_pass http://splitllm_v2;
        proxy_set_header Host $host;
        access_log off;
    }
}
