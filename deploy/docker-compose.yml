# Plain-Docker deployment, for the homeserver without going through Pterodactyl.
#
# Use this when you want the backend up in one command; use the egg when you
# want it managed alongside the game servers with a console and resource limits.
# They build the same image and behave identically.
#
#   cd ~/splitllm-v2
#   printf 'SPLITLLM_API_TOKEN=%s\n' "$(openssl rand -hex 32)" > .env
#   docker compose up -d --build
#
services:
  splitllm:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: splitllm-v2:latest
    container_name: splitllm-v2
    restart: unless-stopped
    # Which interface the port is published on.
    #
    # Loopback by default, because a fresh install should not be reachable from
    # anywhere until someone decides otherwise. A node fronted by a reverse
    # proxy on ANOTHER machine has to bind the interface that proxy can reach —
    # for the WireGuard setup here that is `SPLITLLM_BIND_ADDR=10.7.0.2`, which
    # exposes it on the tunnel and nowhere else.
    #
    # Deliberately not 0.0.0.0: that publishes on every interface the host has,
    # including any public one, which is how an authenticated-but-private
    # service quietly becomes an internet-facing one.
    ports:
      - "${SPLITLLM_BIND_ADDR:-127.0.0.1}:${SPLITLLM_PORT:-8080}:8080"
    environment:
      SPLITLLM_API_TOKEN: ${SPLITLLM_API_TOKEN:?set SPLITLLM_API_TOKEN in .env}
      SPLITLLM_MODEL: ${SPLITLLM_MODEL:-qwen3:4b}
      SPLITLLM_BIND: "0.0.0.0"
      SPLITLLM_PORT: "8080"
      SPLITLLM_MAX_CONCURRENT: ${SPLITLLM_MAX_CONCURRENT:-1}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://127.0.0.1:11434}
      OLLAMA_MODELS: /home/container/data/ollama
      SPLITLLM_DB: /home/container/data/splitllm.db
    volumes:
      # Model weights and the knowledge graph. Losing this means re-downloading
      # several GB and relearning the graph, so it is a named volume rather than
      # anything tied to the container lifecycle.
      - splitllm-data:/home/container/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/ping"]
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 3
    # A 4B model on CPU will take every core it is given. Leaving headroom is
    # not politeness: this box also runs Wings, and a starved Wings drops the
    # panel websocket.
    # Top-level `cpus`/`mem_limit`, NOT `deploy.resources.limits`.
    #
    # `deploy:` is Swarm-only. `docker compose up` parses it, applies nothing,
    # and reports no error — so this file promised a 6-core cap and ran
    # unbounded. Caught by the node's own /health: it reports `cores` from the
    # cgroup quota and `hostCores` from the kernel, and both read 32.
    #
    # This matters here specifically. The host also runs Wings and several game
    # servers, and an unbounded Ollama will take every core it can reach — on a
    # box with a history of falling over under load, that is a contributor
    # whether or not it is the original cause.
    cpus: ${SPLITLLM_CPUS:-6}
    mem_limit: ${SPLITLLM_MEMORY:-8g}
    # Restart the container if it exceeds the memory cap rather than letting the
    # kernel OOM-killer pick a victim, which on this host might be a game server.
    oom_kill_disable: false

volumes:
  splitllm-data:
